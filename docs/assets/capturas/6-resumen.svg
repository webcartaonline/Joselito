<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="784" height="283" viewBox="0 0 784 283" role="img" aria-label="Resumen breve" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Resumen breve</title><style>@font-face{font-family:'JB';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'JB';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}text{font-family:'JB', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;white-space:pre;font-variant-ligatures:none;}</style><rect x="0" y="0" width="784" height="283" rx="14" fill="#0C1220"/><rect x="10" y="16" width="764" height="257" rx="8" fill="#0C1220" stroke="#26324C" stroke-width="1.4"/><rect x="338.0" y="14" width="108.0" height="4" fill="#0C1220"/><text x="338.0" y="20.3" font-size="12" fill="#6E7C98" textLength="108.0" lengthAdjust="spacingAndGlyphs"> Resumen breve </text><text x="32.00" y="52.00" font-size="12.5" fill="#6E7C98" textLength="720.00" lengthAdjust="spacingAndGlyphs">────────────────────────────────────────────────────────────────────────────────────────────────</text><text x="32.00" y="68.25" font-size="12.5" fill="#F4C55B" font-weight="700">#</text><text x="47.00" y="68.25" font-size="12.5" fill="#F4C55B" font-weight="700" textLength="240.00" lengthAdjust="spacingAndGlyphs">¿Quieres un resumen breve? (Y/N)</text><text x="47.00" y="84.50" font-size="12.5" fill="#6E7C98">»</text><text x="62.00" y="84.50" font-size="12.5" fill="#D5DEEA">Y</text><text x="47.00" y="117.00" font-size="12.5" fill="#D5DEEA" textLength="97.50" lengthAdjust="spacingAndGlyphs">Resumiendo...</text><text x="152.00" y="117.00" font-size="12.5" fill="#7DDB94" textLength="300.00" lengthAdjust="spacingAndGlyphs">━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</text><text x="459.50" y="117.00" font-size="12.5" fill="#CF8EF5" textLength="30.00" lengthAdjust="spacingAndGlyphs">100%</text><text x="32.00" y="149.50" font-size="12.5" fill="#7FA6FF" textLength="720.00" lengthAdjust="spacingAndGlyphs">╭─────────────────────────────── Resumen breve de Agujero negro ───────────────────────────────╮</text><path d="M35.75 153.00V174.75" stroke="#7FA6FF" stroke-width="1.15"/><text x="47.00" y="165.75" font-size="12.5" fill="#D5DEEA" textLength="645.00" lengthAdjust="spacingAndGlyphs">Un agujero negro es una región del espacio con una gravedad tan intensa que nada puede</text><path d="M748.25 153.00V174.75" stroke="#7FA6FF" stroke-width="1.15"/><path d="M35.75 169.25V191.00" stroke="#7FA6FF" stroke-width="1.15"/><text x="47.00" y="182.00" font-size="12.5" fill="#D5DEEA" textLength="690.00" lengthAdjust="spacingAndGlyphs">escapar, salvo procesos cuánticos, y está delimitada por el horizonte de sucesos. En 2016 se</text><path d="M748.25 169.25V191.00" stroke="#7FA6FF" stroke-width="1.15"/><path d="M35.75 185.50V207.25" stroke="#7FA6FF" stroke-width="1.15"/><text x="47.00" y="198.25" font-size="12.5" fill="#D5DEEA" textLength="637.50" lengthAdjust="spacingAndGlyphs">detectaron por primera vez ondas gravitacionales de la fusión de dos agujeros negros,</text><path d="M748.25 185.50V207.25" stroke="#7FA6FF" stroke-width="1.15"/><path d="M35.75 201.75V223.50" stroke="#7FA6FF" stroke-width="1.15"/><text x="47.00" y="214.50" font-size="12.5" fill="#D5DEEA" textLength="675.00" lengthAdjust="spacingAndGlyphs">confirmando su existencia. La relatividad general predijo estos objetos, y se cree que hay</text><path d="M748.25 201.75V223.50" stroke="#7FA6FF" stroke-width="1.15"/><path d="M35.75 218.00V239.75" stroke="#7FA6FF" stroke-width="1.15"/><text x="47.00" y="230.75" font-size="12.5" fill="#D5DEEA" textLength="457.50" lengthAdjust="spacingAndGlyphs">agujeros negros supermasivos en el centro de muchas galaxias.</text><path d="M748.25 218.00V239.75" stroke="#7FA6FF" stroke-width="1.15"/><text x="32.00" y="247.00" font-size="12.5" fill="#7FA6FF" textLength="720.00" lengthAdjust="spacingAndGlyphs">╰──────────────────────────────────────────────────────────────────────────────────────────────╯</text></svg>